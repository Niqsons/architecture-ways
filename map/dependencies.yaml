      механизмом, что и отчёт о расхождениях.
    confidence: средняя

  - from: "2.1"
    to: "2.6"
    type: strengthens
    modality: derived
    rationale: >
      «Скрипт до модели» и «контекст собирается скриптом» — две грани
      одного принципа: модель получает подготовленный вход.
    confidence: высокая

  - from: "6.6"
    to: "5.1"
    type: feeds
    modality: derived
    rationale: >
      «Всё, что нельзя зафиксировать, не может давать зелёный цвет» —
      прямое ограничение на градацию уверенности.
    confidence: высокая

  - from: "6.6"
    to: "5.6"
    type: strengthens
    modality: derived
    rationale: >
      Фиксация версии модели — общее поле у обоих приёмов;
      5.6 записывает её в провенанс, 6.6 требует её зафиксировать.
    confidence: высокая

  - from: "7.4"
    to: "8.1"
    type: constrains
    modality: derived
    rationale: >
      Единица индексации задаёт, что именно попадает в индекс
      гибридного поиска.
    confidence: высокая

  - from: "3.3"
    to: "4.2"
    type: requires
    modality: derived
    rationale: >
      Порядок миграции определяется тем, чьи якоря стыкуются с живым
      кодом. Это знание даёт отчёт о расхождениях.
    confidence: средняя

  - from: "1.4"
    to: "1.1"
    type: strengthens
    modality: derived
    rationale: >
      Оба решают одну задачу — отвязать адресацию от изменяемого
      текста. 1.1 на уровне объекта, 1.4 на уровне раздела.
    confidence: высокая

  - from: "2.3"
    to: "2.1"
    type: strengthens
    modality: derived
    rationale: >
      «Модель не видит источник» — предельная форма «скрипта до модели»:
      скрипт не просто готовит вход, он единственный источник входа.
    confidence: высокая

  - from: "8.4"
    to: "3.5"
    type: requires
    modality: derived
    rationale: >
      Смена хранилища безопасна только потому, что источник — текст в
      git, а база пересобирается. Без 3.5 миграция хранилища — риск.
    confidence: высокая

# ---------------------------------------------------------------------
# КЛАСТЕРЫ — приёмы, которые надо писать одним заходом
# ---------------------------------------------------------------------

clusters:

  - id: gap-honesty
    title: Честность о незнании
    techniques: ["4.7", "4.5", "4.8", "5.7", "2.8"]
    rationale: >
      Один связный сюжет: у порождения должен быть выход в пробел,
      у извлечения — в unknown, контролёр не наказывает за честность,
      модальность не повышается, источник фактов ровно один.
      Три из пяти имеют наблюдённый отказ (2.8, 4.8, 5.7) — самая
      высокая плотность доказательного материала в каталоге.
      4.7 и 4.5 отказа не имеют, но 4.7 — несущий: без выхода
      в пробел остальные четыре обходятся достраиванием.
    observed_failures: 3
    priority: 1
    note: >
      §11 каталога прямо называет эту пятёрку: «стоят почти ноль и
      закрывают наблюдённые отказы». Начинать с 4.7.

  - id: completeness-trust
    title: Полнота и экономика ревью
    techniques: ["4.1", "5.2", "9.5", "6.7", "5.1"]
    rationale: >
      Обратный индекс даёт полноту → полнота позволяет расщепить
      зелёное → расщепление проверяется метрикой → растущий чекер
      переносит жёлтое в зелёное. Замкнутый контур, объясняющий
      экономический смысл проекта.
    observed_failures: 1
    priority: 2

  - id: substrate
    title: Субстрат — идентичность и связывание
    techniques: ["1.1", "1.2", "1.3", "2.2", "4.2", "3.5"]
    rationale: >
      Фундамент из §11. Не требует модели, даёт результат сам по себе.
      1.3 — несущий: без разделения якорей связывание бесполезно.
    observed_failures: 0
    priority: 3

  - id: weak-model
    title: Работа со слабой моделью
    techniques: ["2.1", "2.4", "2.5", "2.6", "2.7", "6.1", "6.2", "6.5", "6.6"]
    rationale: >
      Как устроен любой шаг с моделью. Прямо выведен из ограничения
      Qwen 3.6 27B / 3.5 397B-A17B.
    observed_failures: 0
    priority: 4

  - id: context-state
    title: Контекст и состояние
    techniques: ["7.1", "7.2", "7.3", "2.5"]
    rationale: >
      Следствия ограниченного окна. 7.2 несёт наблюдённый отказ
      про расхождение соседних объектов.
    observed_failures: 1
    priority: 5

  - id: change-history
    title: Изменения и история
    techniques: ["3.1", "3.2", "3.3", "3.4", "3.6", "3.7", "1.1"]
    rationale: >
      Дельты, журнал намерений, миграция. 3.6 (инструкции как корпус)
      несёт наблюдённый отказ и связывает группу с 6.7. 3.7 (правило
      несёт причину) — про содержание инструкции, тогда как 3.6 про её
      статус артефакта; вместе они закрывают инструкцию с двух сторон,
      и 3.7 тоже граничит с 6.7, но с обратной стороны: что НЕ выражается
      проверкой и потому остаётся текстом.
    observed_failures: 2
    priority: 6

  - id: reading
    title: Чтение и поиск
    techniques: ["8.1", "8.2", "8.3", "8.4", "7.4", "4.6", "5.5", "9.2"]
    rationale: >
      Процесс-потребитель «чтение». Строится вторым по PIPELINE §5.
    observed_failures: 0
    priority: 7

  - id: evaluation
    title: Оценка и регрессия
    techniques: ["9.1", "9.2", "9.3", "9.4", "9.6", "6.4"]
    rationale: Накопление знания о качестве. Третья группа §11.
    observed_failures: 0
    priority: 8

