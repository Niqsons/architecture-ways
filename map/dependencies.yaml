edges:

  # --- Явные: в тексте каталога стоит ссылка §X.Y ---

  - from: "3.1"
    to: "1.1"
    type: requires
    modality: explicit
    anchor: "строка 172"
    quote: "Привязка дельты — по машинному id (§1.1), не по заголовку."

  - from: "3.6"
    to: "3.1"
    type: requires
    modality: explicit
    anchor: "строка 216"
    quote: "правятся дельтой к текущей версии (§3.1), а не переписыванием целиком"

  - from: "3.6"
    to: "3.2"
    type: requires
    modality: explicit
    anchor: "строка 216"
    quote: "У каждого правила есть запись, почему оно появилось (§3.2)."

  - from: "4.7"
    to: "4.5"
    type: strengthens
    modality: explicit
    anchor: "строка 284, заголовок"
    quote: "Пробел как штатный выход порождения — ВАШ, расширение §4.5"
    note: >
      Каталог называет 4.7 расширением 4.5, но там же разводит их:
      unknown адресуется разработчику правил, пробел — автору источника.
      Две разные очереди, смешивать не надо.

  - from: "4.8"
    to: "4.7"
    type: requires
    modality: explicit
    anchor: "строка 300"
    quote: "Пробелы, честно помеченные автором (§4.7), в находки не идут"

  - from: "5.7"
    to: "4.7"
    type: requires
    modality: explicit
    anchor: "строка 370"
    quote: >
      Порождающий шаг, столкнувшийся с непонижаемым конфликтом,
      обязан оставить пробел (§4.7), а не выбрать значение.

  - from: "5.7"
    to: "2.8"
    type: independent
    modality: explicit
    anchor: "строка 372"
    quote: >
      §2.8 задаёт, кто из входов авторитетен; здесь — что именно внутри
      авторитетного входа является утверждением. Приёмы независимы:
      второй нужен и когда вход всего один.

  - from: "6.3"
    to: "4.1"
    type: constrains
    modality: explicit
    anchor: "строка 402"
    quote: >
      Порождение текста и, главное, локализация в docs.sbt — там нужна
      полнота, а её даёт индекс (§4.1), не голосование.

  - from: "6.7"
    to: "3.6"
    type: strengthens
    modality: explicit
    anchor: "строка 436"
    quote: >
      Правка промпта не проверяема, не переживает смену модели и
      незаметно откатывается при следующей переработке инструкции (§3.6).

  - from: "6.7"
    to: "5.2"
    type: feeds
    modality: explicit
    anchor: "строка 438"
    quote: >
