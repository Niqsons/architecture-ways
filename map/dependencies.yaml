# Карта зависимостей архитектурных приёмов
#
# ИСТОЧНИК ИСТИНЫ для карты связей. Markdown-версия (dependencies.md)
# выводится отсюда, а не наоборот (ARCHITECTURE.md §3.5).
#
# Назначение: вход для фабрики артефактов. Фабрика по этой карте
# собирает контекст на каждый артефакт — какие приёмы подать вместе,
# какие кластеры писать одним заходом.
#
# МОДАЛЬНОСТЬ СВЯЗИ (ARCHITECTURE.md §5.7 — понижать можно, повышать нет):
#   explicit — в тексте каталога стоит явная ссылка «§X.Y».
#              Извлечено детерминированно. ФАКТ.
#   derived  — связь выведена из смысла, явной ссылки нет.
#              Суждение Claude Opus 5, требует подтверждения человеком.
#
# ТИП СВЯЗИ:
#   requires    — без цели приём невозможен или бессмыслен
#   strengthens — работает и без цели, но с ней заметно сильнее
#   independent — явно названы независимыми, но применяются вместе
#   supersedes  — делает цель ненужной
#   constrains  — ограничивает область применения цели
#   feeds       — поставляет цели входные данные
#
# ИСТОЧНИК ПРОЕКТА (добавлено 2026-08-03). Буквенные коды GB/SD/OS убраны
# из каталога: разобранных проектов становится больше, и трёхбуквенная
# пометка перестаёт читаться раньше, чем перестаёт помещаться. В каталоге
# осталось Other / SELF / PRACT, а конкретный проект живёт здесь —
# поле source_projects. Машиночитаемо и рядом со связями.
#
# Версия карты: v2 (2026-08-03), правка 2026-08-01 — добавлен приём 3.7
#
# ХЕШ ИСТОЧНИКА — теперь от СОДЕРЖИМОГО, а не от коммита, и это применение
# собственного §1.2. Хеш коммита — позиционная ссылка: он не проверяется
# без git, устаревает при любом коммите рядом и создаёт порядок «сначала
# закоммить, потом впиши хеш», при котором поле систематически отстаёт.
# Хеш содержимого пересчитывается одной командой и проверяется кем угодно:
#   python -c "import hashlib;print(hashlib.sha256(open('ARCHITECTURE.md','rb').read()).hexdigest())"
# Коммит оставлен как удобный указатель в историю, но истина — sha256.

