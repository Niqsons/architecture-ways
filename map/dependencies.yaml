      в источнике состояния: OpenSpec выводит его из файловой системы
      при каждом запросе (detectCompleted обходит артефакты, признак —
      файл существует), beads хранит в базе задач. Проверено по
      исходникам OpenSpec 1.7.0: топологический порядок — алгоритм
      Кана, состояний четыре, а не три — done / skipped / ready /
