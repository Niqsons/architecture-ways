edges:

  # --- Явные: в тексте каталога стоит ссылка §X.Y ---

  - from: "3.1"
    to: "1.1"
    type: requires
    modality: explicit
    anchor: "§3.1"
    quote: "Привязка дельты — по машинному id (§1.1), не по заголовку."

  - from: "3.6"
    to: "3.1"
    type: requires
    modality: explicit
    anchor: "§3.6"
    quote: "правятся **дельтой к текущей версии** (§3.1), а не переписыванием целиком"

  - from: "3.6"
    to: "3.2"
    type: requires
    modality: explicit
    anchor: "§3.6"
    quote: "У каждого правила есть запись, почему оно появилось (§3.2)."

  - from: "3.7"
    to: "3.6"
    type: requires
    modality: derived
    note: >
      Причина живёт рядом с правилом только если инструкция —
      версионируемый артефакт. Без 3.6 обоснование теряется при
      следующей переработке инструкции, ровно как теряются сами
      правила. Явной ссылки в тексте 3.7 нет: связь выведена
      из соседства в группе и требует подтверждения человеком.

  - from: "3.7"
    to: "3.2"
    type: independent
    modality: explicit
    anchor: "§3.7, абзац «Отличие от соседей»"
    quote: >
      §3.2 хранит обоснование применённой дельты — для того, кто позже
      спросит «почему поменяли».
    note: >
      Разные адресаты и разные моменты чтения. 3.2 — читателю истории
      постфактум; 3.7 — исполнителю ДО отклонения от правила.
      Применяются вместе, друг друга не заменяют.

  - from: "3.7"
    to: "6.7"
    type: constrains
    modality: explicit
    anchor: "3.7, абзац «Отличие от соседей»"
    quote: >
      §6.7 требует превращать дефект **в проверку**, а не в текст.
    note: >
      6.7 имеет приоритет: выразимое проверкой идёт в чекер. 3.7
      применяется к остатку — правилам, которые проверкой не выражаются.
      Обратный порядок превратил бы 3.7 в оправдание текстовых правил
      там, где нужна проверка.

  - from: "4.7"
    to: "4.5"
    type: strengthens
    modality: explicit
    anchor: "§4.7, заголовок"
    quote: "Пробел как штатный выход порождения — SELF, расширение §4.5"
    note: >
      Каталог называет 4.7 расширением 4.5, но там же разводит их:
      unknown адресуется разработчику правил, пробел — автору источника.
      Две разные очереди, смешивать не надо.

  - from: "4.8"
    to: "4.7"
    type: requires
    modality: explicit
    anchor: "§4.8"
    quote: "Пробелы, честно помеченные автором (§4.7), в находки не идут"

  - from: "5.7"
    to: "4.7"
    type: requires
    modality: explicit
    anchor: "§5.7"
    quote: >
      Порождающий шаг, столкнувшийся с непонижаемым конфликтом,
      обязан оставить пробел (§4.7), а не выбрать значение.

  - from: "5.7"
    to: "2.8"
    type: independent
    modality: explicit
    anchor: "§5.7"
