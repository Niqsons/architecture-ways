      значит, нужен чекер (6.7) и эталонный набор (9.3) для них.
      Рекурсия: каталог применяется к самому себе.
    blocks: [проектирование фабрики]
    severity: высокая
    note: >
      Это не пробел каталога, а новая задача, возникшая из решения
