      функции нет. Объявленное множество файлов с фактически
      изменённым не сверяется нигде, а из verify.cjs передаётся
      в checkSchemaDrift первым параметром changedFiles — то есть
      обещание модели дальше по цепочке неотличимо от наблюдения.

