      Ошибка нумерации в каталоге или намеренное отнесение?
    blocks: [артефакты 4.5 и 9.6]
    severity: средняя
    status: closed
    resolution: >
      Ошибка ссылки. Описание «доля unknown» соответствует 9.6, а не 4.5.
      Исправлено 2026-07-30: в третьей группе §11 теперь стоит 9.6,
      а 4.5 добавлен во вторую группу («делает работу модели безопасной»),
      где ему место по смыслу — это приём про выход, а не метрика.

  - id: OQ-4
    question: >
      Группа 8 целиком помечена как «берём», но §11 относит её к
