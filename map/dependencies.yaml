      понимающий причину восстанавливает не букву, а защиту.
    boundary: >
      Не масштабируется на длинные регламенты: инструкция, которую
      перестают дочитывать, защищает хуже короткой. Причина пишется
      к правилам, которые можно нарушить со смыслом; к тривиальным
      (порядок запуска, формат вызова) — нет.

