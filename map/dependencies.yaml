# Карта зависимостей архитектурных приёмов
#
# ИСТОЧНИК ИСТИНЫ для карты связей. Markdown-версия (dependencies.md)
# выводится отсюда, а не наоборот (ARCHITECTURE.md §3.5).
#
# Назначение: вход для фабрики артефактов. Фабрика по этой карте
# собирает контекст на каждый артефакт — какие приёмы подать вместе,
# какие кластеры писать одним заходом.
#
# МОДАЛЬНОСТЬ СВЯЗИ (ARCHITECTURE.md §5.7 — понижать можно, повышать нет):
#   explicit — в тексте каталога стоит явная ссылка «§X.Y».
#              Извлечено детерминированно. ФАКТ.
#   derived  — связь выведена из смысла, явной ссылки нет.
#              Суждение Claude Opus 5, требует подтверждения человеком.
#
# ТИП СВЯЗИ:
#   requires    — без цели приём невозможен или бессмыслен
#   strengthens — работает и без цели, но с ней заметно сильнее
#   independent — явно названы независимыми, но применяются вместе
#   supersedes  — делает цель ненужной
#   constrains  — ограничивает область применения цели
#   feeds       — поставляет цели входные данные
#
# Версия карты: v1 (2026-07-29)
# Хеш источника: ARCHITECTURE.md на коммите f694c0b

meta:
  version: 1
  created: 2026-07-29
  source_document: ARCHITECTURE.md
  source_commit: f694c0b
  total_techniques: 55
  techniques_by_group: {1: 5, 2: 8, 3: 6, 4: 8, 5: 7, 6: 7, 7: 4, 8: 4, 9: 6}
  observed_failures: 6   # 2.8, 3.6, 4.8, 5.7, 6.7, 7.2
  edges: {explicit: 19, derived: 25}
  extraction_method: >
    Явные ссылки — grep по шаблону §\d+(\.\d+)? с последующей ручной
    сверкой контекста. Неявные — чтение целиком, помечены derived.

